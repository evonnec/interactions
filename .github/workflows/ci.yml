name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv run ruff check --output-format=github .

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv run mypy src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv run pytest --cov=interactions --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build and smoke test
    needs: [lint, format, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          python-version-file: .python-version
      - run: uv sync --locked --all-groups
      - run: uv build
      - name: Smoke test built wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/interactions" < input.txt > "$RUNNER_TEMP/out.txt"
          test -s "$RUNNER_TEMP/out.txt"
          head -n 3 "$RUNNER_TEMP/out.txt"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
